# The origin backends for the Phase 9 benchmark: nginx serving fixed 1 KB
# and 100 KB files, plain HTTP on 127.0.0.1:@PORT@ (compose.yml fills it). Generous enough never to be the
# bottleneck: no logging, files cached open, keep-alive connections that
# last (so the proxies under test reuse them instead of reconnecting).
worker_processes 2;
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /tmp/nginx-origin.pid;

events {
    worker_connections 8192;
}

http {
    access_log off;
    server_tokens off;
    keepalive_timeout 300s;
    keepalive_requests 1000000;
    open_file_cache max=16 inactive=1h;
    open_file_cache_valid 1h;
    default_type application/octet-stream;

    server {
        # A socket per worker, as in nginx-proxy.conf, so the devices under
        # test's long-lived upstream connections spread over both workers.
        listen 127.0.0.1:@PORT@ default_server reuseport;
        root /srv;
        location = /healthz { return 200 "ok\n"; }
        location / { }
    }
}
