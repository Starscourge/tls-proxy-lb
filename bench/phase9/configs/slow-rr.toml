# bench/phase9/demo-slow.sh, run "rr": round-robin, no passive ejection. A backend leaves only after three failed active checks in a row, and a 200 ms delay never fails one (500 ms timeout).
# Mounted over lab/proxy.toml (PROXY_CONFIG); the certificates are the lab's.
# Everything not set here is the proxy's default.
default_pool = "all"

[[listener]]
address = "0.0.0.0:8443"

[tls]
default_cert = "certs/default.test.crt"
default_key  = "certs/default.test.key"

[pool.all]
algorithm = "round_robin"
backends  = [
  { address = "10.0.0.11:8000" },
  { address = "10.0.0.12:8000" },
  { address = "10.0.0.13:8000" },
]

[timeouts]
upstream_connect_ms  = 1000
upstream_response_ms = 10000

[health]
path             = "/healthz"
interval_ms      = 1000
timeout_ms       = 500
rise             = 2
fall             = 3
passive_failures = 0
eject_ms         = 5000

[admin]
address = "127.0.0.1:9901"

[limits]
max_conns_per_ip = 2048
