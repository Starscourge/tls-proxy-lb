# The lab: the proxy, three test backends and a load generator, each in its
# own container on one bridge network with fixed addresses.
#
#   lab/gen-certs.sh lab/certs
#   LAB_UID=$(id -u) LAB_GID=$(id -g) docker compose -f lab/docker-compose.yml up -d --build --wait
#
# (make lab-up does both.) The proxy runs as LAB_UID:LAB_GID so it can read
# the private keys in lab/certs, which stay mode 0600 and owned by you.
#   docker compose -f lab/docker-compose.yml exec backend1 tc qdisc add dev eth0 root netem delay 100ms
#
# Backends have NET_ADMIN so tc/netem can shape their traffic.
name: tlslab

x-backend: &backend
  build:
    context: ..
    dockerfile: lab/Dockerfile
    target: testbackend
  image: tlslab/testbackend:dev
  cap_add: [NET_ADMIN]
  restart: "no"
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
    interval: 2s
    timeout: 1s
    retries: 10
    start_period: 2s

services:
  proxy:
    build:
      context: ..
      dockerfile: lab/Dockerfile
      target: proxy
    image: tlslab/proxy:dev
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    # Pools and routes over the three backends; see proxy.toml.
    command: ["-config", "/etc/proxy/proxy.toml"]
    volumes:
      - ./proxy.toml:/etc/proxy/proxy.toml:ro
      - ./certs:/etc/proxy/certs:ro
    # busybox wget sends the IP literal as SNI, which no route names, so this
    # gets the default certificate and the default pool. It would verify the
    # certificate against the system roots, hence --no-check-certificate.
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s
    networks:
      lab:
        ipv4_address: 10.0.0.10
    depends_on:
      backend1: {condition: service_healthy}
      backend2: {condition: service_healthy}
      backend3: {condition: service_healthy}

  backend1:
    <<: *backend
    command: ["-port", "8000", "-name", "backend1"]
    networks:
      lab:
        ipv4_address: 10.0.0.11

  backend2:
    <<: *backend
    command: ["-port", "8000", "-name", "backend2"]
    networks:
      lab:
        ipv4_address: 10.0.0.12

  backend3:
    <<: *backend
    command: ["-port", "8000", "-name", "backend3"]
    networks:
      lab:
        ipv4_address: 10.0.0.13

  loadgen:
    build:
      context: ..
      dockerfile: lab/Dockerfile
      target: loadgen
    image: tlslab/loadgen:dev
    init: true
    volumes:
      - ./certs/ca.crt:/work/ca.crt:ro
    networks:
      lab:
        ipv4_address: 10.0.0.20

networks:
  lab:
    ipam:
      config:
        - subnet: 10.0.0.0/24
