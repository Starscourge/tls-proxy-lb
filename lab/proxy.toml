# Proxy config for the lab, mounted at /etc/proxy/proxy.toml, with the
# certificates from lab/gen-certs.sh mounted at /etc/proxy/certs.
# Check it with: docker compose -f lab/docker-compose.yml exec proxy \
#   /usr/local/bin/proxy -config /etc/proxy/proxy.toml -check-config
#
# HTTPS on 8443: SNI picks the certificate and the pool. Plain HTTP on 8080
# redirects to it.

# Hosts with no route, including the container healthcheck (no SNI).
default_pool = "all"

[[listener]]
address = "0.0.0.0:8443"
mode    = "https"

[[listener]]
address       = "0.0.0.0:8080"
mode          = "redirect"
redirect_port = 8443

[[route]]
host = "a.test"
pool = "pool_a"
cert = "certs/a.test.crt"
key  = "certs/a.test.key"

[[route]]
host = "b.test"
pool = "pool_b"
cert = "certs/b.test.crt"
key  = "certs/b.test.key"

# Rate limited for the Phase 6 k6 check (bench/phase6/k6.sh): each client
# address gets 200 requests per second with a burst of 20. It has no
# certificate of its own, so it is served the default one; k6 cannot be
# given the lab CA and skips verification anyway.
[[route]]
host = "limited.test"
pool = "pool_a"
rate_limit = { rate = 200, burst = 20 }

# Served to clients without SNI and to names with no route.
[tls]
default_cert = "certs/default.test.crt"
default_key  = "certs/default.test.key"

[pool.all]
algorithm = "round_robin"
backends  = [
  { address = "10.0.0.11:8000" },
  { address = "10.0.0.12:8000" },
  { address = "10.0.0.13:8000" },
]

[pool.pool_a]
algorithm = "least_conn"
backends  = [
  { address = "10.0.0.11:8000" },
  { address = "10.0.0.12:8000" },
  { address = "10.0.0.13:8000" },
]

[pool.pool_b]
algorithm = "consistent_hash"
hash_key  = "header:X-User-Id"
backends  = [
  { address = "10.0.0.11:8000" },
  { address = "10.0.0.12:8000" },
  { address = "10.0.0.13:8000" },
]

[timeouts]
handshake_ms         = 5000
header_read_ms       = 5000
upstream_connect_ms  = 1000
upstream_response_ms = 10000
idle_ms              = 60000
client_io_ms         = 60000
# How long SIGTERM waits for open requests; inside docker stop's 10 s.
shutdown_ms          = 8000

# Health checks: active checks every second, and passive ejection after
# three failures in a row in live traffic, for five seconds.
[health]
path             = "/healthz"
interval_ms      = 1000
timeout_ms       = 500
rise             = 2
fall             = 3
passive_failures = 3
eject_ms         = 5000

# /metrics, /status and pprof, on loopback inside the proxy container.
# Prometheus shares the container's network namespace to scrape it.
[admin]
address = "127.0.0.1:9901"

# Rate limiting is off by default ([rate_limit] sets no rate) and on for the
# routes that ask for it. Buckets for clients idle a whole refill time are
# swept every 10 s.
[rate_limit]
max_entries = 100000
sweep_ms    = 10000

# One client address may hold at most this many connections; more are
# closed at accept, before the TLS handshake. High enough for the Phase 9
# runs at concurrency 1,000 from the single loadgen.
[limits]
max_conns_per_ip = 2048
# The test backends' /echo streams, but a real backend may read a body
# whole: cap what reaches it.
max_body_bytes   = 104857600
